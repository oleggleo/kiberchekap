name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kiberchekap
          POSTGRES_PASSWORD: kiberchekap
          POSTGRES_DB: kiberchekap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiberchekap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r backend/requirements-dev.txt

      - run: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://kiberchekap:kiberchekap@localhost:5432/kiberchekap
