<script>
(function(){
  var cv=document.getElementById('radarCv'); if(!cv||!cv.getContext)return;
  var ctx=cv.getContext('2d');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var DPR=Math.min(window.devicePixelRatio||1,2);
  var card=document.getElementById('radarCard');
  var legendEl=document.getElementById('radarLegend');
  var focusEl=document.getElementById('radarFocus');

  var VEC=[
    {s:'Периметр',     lab:'Периметр', n:'Уязвимости периметра',  v:60},
    {s:'Веб-приложения',lab:'Веб',     n:'Веб-приложения',        v:42},
    {s:'Утечки паролей',lab:'Пароли',  n:'Утечки паролей',         v:44},
    {s:'Конфигурации', lab:'Конфиги',  n:'Ошибки конфигурации',    v:51},
    {s:'Соц. инженерия',lab:'Соц.инж.',n:'Социальная инженерия',   v:68},
    {s:'OSINT',        lab:'OSINT',    n:'OSINT и разведка',        v:47}
  ];
  var TEAL=[10,147,150], TEAL2=[0,95,115], INK=[17,26,39];
  function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
  var DEF='Шесть направлений, по которым работает белый хакер';

  var focus=-1, growth=0, sweep=-Math.PI/2, running=false, raf=0, last=0, Wc=0;

  // build legend
  VEC.forEach(function(d,i){
    var li=document.createElement('div');
    li.className='radar-li';
    li.innerHTML='<span class="radar-dot"></span><span class="radar-li-name">'+d.s+'</span><span class="radar-li-val">'+d.v+'%</span>';
    li.addEventListener('pointerenter',function(){setFocus(i);});
    li.addEventListener('pointerleave',function(){setFocus(-1);});
    legendEl.appendChild(li);
  });
  var lis=legendEl.querySelectorAll('.radar-li');

  function setFocus(i){
    if(focus===i)return; focus=i;
    for(var k=0;k<lis.length;k++)lis[k].classList.toggle('on',k===i);
    if(i<0){focusEl.innerHTML=DEF;}
    else{focusEl.innerHTML='<b>'+VEC[i].n+'</b> - точка входа в '+VEC[i].v+'% проверок';}
    if(!running)render();
  }

  function size(){
    var r=cv.getBoundingClientRect(); Wc=Math.max(1,r.width);
    cv.width=Math.round(Wc*DPR); cv.height=Math.round(Wc*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function pt(cx,cy,ang,r){return [cx+Math.cos(ang)*r, cy+Math.sin(ang)*r];}
  function ax(i){return -Math.PI/2 + i*Math.PI/3;}

  function render(){
    if(!Wc)size();
    var cx=Wc/2, cy=Wc/2, R=Wc*0.34, i, p;
    ctx.clearRect(0,0,Wc,Wc);

    // rings
    var rings=[0.25,0.5,0.75,1];
    for(var ri=0;ri<rings.length;ri++){
      ctx.beginPath();
      for(i=0;i<6;i++){p=pt(cx,cy,ax(i),R*rings[ri]); if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);}
      ctx.closePath();
      ctx.strokeStyle=rgba(INK, ri===rings.length-1?0.14:0.07); ctx.lineWidth=1; ctx.stroke();
    }
    // axes
    for(i=0;i<6;i++){p=pt(cx,cy,ax(i),R); ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p[0],p[1]);ctx.strokeStyle=rgba(INK,0.06);ctx.lineWidth=1;ctx.stroke();}

    // sonar sweep (motion only)
    if(!reduce && ctx.createConicGradient){
      var cg=ctx.createConicGradient(sweep,cx,cy);
      cg.addColorStop(0,rgba(TEAL,0.20)); cg.addColorStop(0.10,rgba(TEAL,0));
      cg.addColorStop(0.9,rgba(TEAL,0)); cg.addColorStop(1,rgba(TEAL,0.20));
      ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.fillStyle=cg;ctx.fill();
      p=pt(cx,cy,sweep,R);
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p[0],p[1]);ctx.strokeStyle=rgba(TEAL,0.45);ctx.lineWidth=1.3;ctx.stroke();
    }

    // value polygon
    ctx.beginPath();
    for(i=0;i<6;i++){p=pt(cx,cy,ax(i),R*(VEC[i].v/100)*growth); if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);}
    ctx.closePath();
    ctx.fillStyle=rgba(TEAL,0.14); ctx.fill();
    ctx.strokeStyle=rgba(TEAL,0.72); ctx.lineWidth=1.7; ctx.stroke();

    // vertices + labels
    for(i=0;i<6;i++){
      var vr=R*(VEC[i].v/100)*growth; p=pt(cx,cy,ax(i),vr);
      var on=(i===focus);
      if(on){
        ctx.beginPath();ctx.arc(p[0],p[1],8,0,6.2832);ctx.fillStyle=rgba(TEAL,0.18);ctx.fill();
        ctx.beginPath();ctx.arc(p[0],p[1],4.2,0,6.2832);ctx.fillStyle=rgba(TEAL2,1);ctx.fill();
        ctx.lineWidth=1.4;ctx.strokeStyle='#fff';ctx.stroke();
      } else {
        ctx.beginPath();ctx.arc(p[0],p[1],3,0,6.2832);ctx.fillStyle=rgba(TEAL,0.95);ctx.fill();
      }
      // label
      var lp=pt(cx,cy,ax(i),R+R*0.18), a=ax(i);
      ctx.font='600 '+Math.max(8,Math.round(Wc*0.037))+'px Manrope, sans-serif';
      ctx.fillStyle=on?rgba(TEAL2,1):rgba(INK,0.45);
      ctx.textBaseline='middle';
      ctx.textAlign = Math.abs(Math.cos(a))<0.3 ? 'center' : (Math.cos(a)>0?'left':'right');
      ctx.fillText(VEC[i].lab, lp[0], lp[1]);
    }
  }

  function tick(ts){
    if(!last)last=ts; var dt=Math.min((ts-last)/1000,0.05); last=ts;
    if(growth<1) growth=Math.min(1,growth+dt*1.2);
    sweep+=dt*0.55; if(sweep>Math.PI)sweep-=6.2832;
    render();
    if(running) raf=requestAnimationFrame(tick);
  }
  function start(){ if(running||reduce)return; running=true; last=0; raf=requestAnimationFrame(tick); }
  function stop(){ running=false; cancelAnimationFrame(raf); }

  // canvas hover → nearest axis
  cv.addEventListener('pointermove',function(e){
    var r=cv.getBoundingClientRect();
    var dx=e.clientX-r.left-r.width/2, dy=e.clientY-r.top-r.height/2;
    if(Math.sqrt(dx*dx+dy*dy) < r.width*0.10){ setFocus(-1); return; }
    var ang=Math.atan2(dy,dx), best=-1, bd=99;
    for(var i=0;i<6;i++){
      var a=ax(i), d=Math.abs(Math.atan2(Math.sin(ang-a),Math.cos(ang-a)));
      if(d<bd){bd=d;best=i;}
    }
    setFocus(bd<Math.PI/6?best:-1);
  },{passive:true});
  cv.addEventListener('pointerleave',function(){setFocus(-1);});
  if(card){card.addEventListener('pointermove',function(e){
    var r=card.getBoundingClientRect();
    card.style.setProperty('--mx',(e.clientX-r.left)+'px');
    card.style.setProperty('--my',(e.clientY-r.top)+'px');
  },{passive:true});}

  size();
  window.addEventListener('resize',function(){size();if(!running)render();},{passive:true});
  window.addEventListener('load',function(){size();if(!running)render();},{passive:true});

  if('IntersectionObserver'in window){
    new IntersectionObserver(function(es){
      es.forEach(function(en){
        if(en.isIntersecting){ if(reduce){growth=1;render();} else start(); }
        else stop();
      });
    },{threshold:0.2}).observe(cv);
  } else { growth=1; if(reduce)render(); else start(); }
})();
</script>

<script>
(function(){
  var cv=document.getElementById('ctaShield'); if(!cv||!cv.getContext)return;
  var ctx=cv.getContext('2d');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var DPR=Math.min(window.devicePixelRatio||1,2);
  var host=cv.parentNode, W=1, H=1;
  function size(){ var r=cv.getBoundingClientRect(); W=Math.max(1,r.width); H=Math.max(1,r.height);
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }

  var tmx=0.5,tmy=0.5,mx=0.5,my=0.5,hasPointer=false;
  host.addEventListener('pointermove',function(e){var r=host.getBoundingClientRect();tmx=(e.clientX-r.left)/r.width;tmy=(e.clientY-r.top)/r.height;hasPointer=true;},{passive:true});
  host.addEventListener('pointerleave',function(){hasPointer=false;},{passive:true});

  var TEAL=[30,205,190], VIO=[150,128,246], RED=[240,96,84], WHITE=[255,255,255];
  function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
  function rnd(a,b){return a+(b-a)*Math.random();}

  var parts=[]; for(var n=0;n<14;n++)parts.push({ang:rnd(0,6.283),rad:rnd(0,1),sp:rnd(0.1,0.34)*(Math.random()<0.5?-1:1),sz:rnd(0.8,1.9),c:n%2});
  var pulses=[], sparks=[], t=0,last=0,running=false,raf=0,nextPulse=0;

  function shieldPath(cx,cy,s){
    ctx.beginPath();
    ctx.moveTo(cx,cy-s);
    ctx.bezierCurveTo(cx+s*0.9,cy-s*0.66, cx+s*0.9,cy-s*0.5, cx+s*0.9,cy-s*0.15);
    ctx.bezierCurveTo(cx+s*0.9,cy+s*0.6, cx+s*0.52,cy+s*0.98, cx,cy+s*1.18);
    ctx.bezierCurveTo(cx-s*0.52,cy+s*0.98, cx-s*0.9,cy+s*0.6, cx-s*0.9,cy-s*0.15);
    ctx.bezierCurveTo(cx-s*0.9,cy-s*0.5, cx-s*0.9,cy-s*0.66, cx,cy-s);
    ctx.closePath();
  }

  function render(dt){
    ctx.clearRect(0,0,W,H);
    mx+=(tmx-mx)*0.08; my+=(tmy-my)*0.08;
    var R=Math.min(W,H);
    var ox=(mx-0.5)*10, oy=(my-0.5)*8;          // parallax
    var cx=W*0.5+ox, cy=H*0.5+oy;
    var perimR=R*0.42, shR=R*0.165;

    // ambient particles drifting around the perimeter
    for(var k=0;k<parts.length;k++){ var p=parts[k]; p.ang+=p.sp*dt;
      var pr=perimR*1.08 + p.rad*(R*0.30);
      var px=cx+Math.cos(p.ang)*pr, py=cy+Math.sin(p.ang)*pr;
      ctx.beginPath();ctx.arc(px,py,p.sz,0,6.2832);ctx.fillStyle=rgba(p.c?VIO:TEAL,0.55);ctx.fill();
    }
    // inner faint ring + rotating dashed perimeter
    ctx.beginPath();ctx.arc(cx,cy,perimR*0.72,0,6.2832);ctx.strokeStyle=rgba(TEAL,0.12);ctx.lineWidth=1;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(t*0.25);
    ctx.beginPath();ctx.setLineDash([4,7]);ctx.arc(0,0,perimR,0,6.2832);
    ctx.strokeStyle=rgba(TEAL,0.34);ctx.lineWidth=1.2;ctx.stroke();ctx.setLineDash([]);ctx.restore();

    // defense pulse rings
    if(!reduce && t>nextPulse){ nextPulse=t+1.7; pulses.push({r:perimR*0.62,a:0.5}); }
    for(var q=pulses.length-1;q>=0;q--){ var pu=pulses[q]; pu.r+=dt*44; pu.a-=dt*0.32;
      if(pu.a<=0){pulses.splice(q,1);continue;}
      ctx.beginPath();ctx.arc(cx,cy,pu.r,0,6.2832);ctx.strokeStyle=rgba(TEAL,pu.a);ctx.lineWidth=1.4;ctx.stroke(); }

    // threat (cursor-aimed, else auto-orbit) — blocked at perimeter
    var ang, td;
    if(hasPointer){ var dx=mx*W-cx, dy=my*H-cy; ang=Math.atan2(dy,dx); td=Math.max(Math.sqrt(dx*dx+dy*dy),perimR+14); }
    else { ang=t*0.6; td=perimR + R*0.24 + Math.sin(t*1.3)*6; }
    var thX=cx+Math.cos(ang)*td, thY=cy+Math.sin(ang)*td;
    var ix=cx+Math.cos(ang)*perimR, iy=cy+Math.sin(ang)*perimR;
    var bg=ctx.createLinearGradient(thX,thY,ix,iy);
    bg.addColorStop(0,rgba(RED,0)); bg.addColorStop(1,rgba(RED,0.85));
    ctx.beginPath();ctx.moveTo(thX,thY);ctx.lineTo(ix,iy);ctx.strokeStyle=bg;ctx.lineWidth=1.7;ctx.stroke();
    ctx.beginPath();ctx.arc(thX,thY,3,0,6.2832);ctx.fillStyle=rgba(RED,0.95);ctx.shadowColor=rgba(RED,0.8);ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
    // shield blocks: glowing arc + impact
    ctx.beginPath();ctx.arc(cx,cy,perimR,ang-0.45,ang+0.45);ctx.strokeStyle=rgba(TEAL,0.75);ctx.lineWidth=2.6;ctx.stroke();
    ctx.beginPath();ctx.arc(ix,iy,5,0,6.2832);ctx.fillStyle=rgba(TEAL,0.85);ctx.shadowColor=rgba(TEAL,0.9);ctx.shadowBlur=11;ctx.fill();ctx.shadowBlur=0;
    if(!reduce && Math.random()<0.45){ for(var m=0;m<2;m++){ var sa=ang+Math.PI+(Math.random()-0.5)*1.5;
      sparks.push({x:ix,y:iy,vx:Math.cos(sa)*rnd(36,80),vy:Math.sin(sa)*rnd(36,80),life:1}); } }
    for(var s=sparks.length-1;s>=0;s--){ var sp=sparks[s]; sp.life-=dt*2.3; if(sp.life<=0){sparks.splice(s,1);continue;}
      sp.x+=sp.vx*dt; sp.y+=sp.vy*dt; ctx.beginPath();ctx.arc(sp.x,sp.y,1.5*sp.life,0,6.2832);ctx.fillStyle=rgba(TEAL,sp.life*0.85);ctx.fill(); }

    // central shield
    var br=0.82+0.18*Math.sin(t*1.7);
    var gg=ctx.createRadialGradient(cx,cy,0,cx,cy,shR*3);
    gg.addColorStop(0,rgba(TEAL,0.34*br)); gg.addColorStop(1,rgba(TEAL,0));
    ctx.beginPath();ctx.arc(cx,cy,shR*3,0,6.2832);ctx.fillStyle=gg;ctx.fill();
    shieldPath(cx,cy,shR);
    var sg=ctx.createLinearGradient(cx,cy-shR,cx,cy+shR*1.2);
    sg.addColorStop(0,rgba([70,235,214],0.96)); sg.addColorStop(1,rgba([10,120,140],0.96));
    ctx.fillStyle=sg;ctx.fill();
    ctx.lineWidth=1.4;ctx.strokeStyle=rgba(WHITE,0.5);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-shR*0.36,cy+shR*0.02);ctx.lineTo(cx-shR*0.06,cy+shR*0.34);ctx.lineTo(cx+shR*0.42,cy-shR*0.32);
    ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.8,shR*0.14);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  }

  function frame(ts){ if(!last)last=ts; var dt=Math.min((ts-last)/1000,0.05); last=ts; t+=dt; render(dt); if(running)raf=requestAnimationFrame(frame); }
  function start(){ if(running||reduce)return; running=true; last=0; raf=requestAnimationFrame(frame); }
  function stop(){ running=false; cancelAnimationFrame(raf); }

  size();
  window.addEventListener('resize',function(){size();if(!running)render(0);},{passive:true});
  window.addEventListener('load',function(){size();if(!running)render(0);},{passive:true});
  if(reduce){ t=0.6; render(0); }
  else if('IntersectionObserver'in window){
    new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)start();else stop();});},{threshold:0}).observe(cv);
  } else start();
})();
</script>

<script>
(function(){
  if(!(window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches)) return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  /* tilt disabled per request — only the cursor spotlight remains (no 3D rotation) */
  document.querySelectorAll('.seg-card,.benefit-card').forEach(function(card){
    var rect=null, raf=0, lx=0, ly=0;
    card.addEventListener('pointerenter',function(){ rect=card.getBoundingClientRect(); },{passive:true});
    card.addEventListener('pointermove',function(e){
      if(!rect) rect=card.getBoundingClientRect();
      lx=e.clientX; ly=e.clientY;
      if(raf) return;
      raf=requestAnimationFrame(function(){
        raf=0;
        card.style.setProperty('--mx',(lx-rect.left)+'px');
        card.style.setProperty('--my',(ly-rect.top)+'px');
      });
    },{passive:true});
    card.addEventListener('pointerleave',function(){ if(raf){cancelAnimationFrame(raf);raf=0;} rect=null; },{passive:true});
  });
})();
</script>

<script>
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce||!('IntersectionObserver'in window))return;
  var els=document.querySelectorAll('.hero-sn,.hero-stat-badge-num,.bi-bar-val');
  function fmt(n){ return n>=1000 ? n.toLocaleString('ru-RU') : String(n); }
  function run(el){
    if(el.dataset.counted)return; el.dataset.counted='1';
    var full=el.textContent;
    var m=full.match(/\d[\d   ]*\d|\d/);
    if(!m)return;
    var raw=m[0], target=parseInt(raw.replace(/[   ]/g,''),10);
    if(!isFinite(target)||target<=0)return;
    var pre=full.slice(0,m.index), post=full.slice(m.index+raw.length);
    var dur=1100, t0=null;
    function step(ts){
      if(!t0)t0=ts;
      var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=pre+fmt(Math.round(target*e))+post;
      if(p<1)requestAnimationFrame(step); else el.textContent=full;
    }
    requestAnimationFrame(step);
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ run(en.target); io.unobserve(en.target); } });
  },{threshold:0.4});
  els.forEach(function(el){ io.observe(el); });
})();
</script>
