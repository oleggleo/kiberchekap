// ─── Form validation helpers
function setError(inputId, errId, show){
  const inp = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if(!inp||!err) return;
  if(show){ inp.classList.add('invalid'); inp.classList.remove('valid'); err.classList.add('show'); }
  else { inp.classList.remove('invalid'); inp.classList.add('valid'); err.classList.remove('show'); }
}
function clearError(inputId, errId){
  const inp = document.getElementById(inputId);
  const err = document.getElementById(errId);
  if(inp){ inp.classList.remove('invalid','valid'); }
  if(err){ err.classList.remove('show'); }
}

// ─── Live validation on blur
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('f_name').addEventListener('blur', function(){
    setError('f_name','err_name', this.value.trim().length < 2);
  });
  document.getElementById('f_email').addEventListener('blur', function(){
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.value.trim());
    setError('f_email','err_email', !ok && this.value.trim().length > 0);
  });
  document.getElementById('f_inn').addEventListener('blur', function(){
    const v = this.value.replace(/\D/g,'');
    setError('f_inn','err_inn', v.length > 0 && v.length !== 10 && v.length !== 12);
  });
});

// ─── Подсказки ОКВЭД
const OKVED_MIN_LENGTH = 3;
const OKVED_DEBOUNCE_MS = 250;

let okvedTimer = null;
let okvedItems = [];
let okvedActive = -1;
let okvedRequestId = 0;

function okvedHint(text, warn){
  const hint = document.getElementById('okved-hint');
  if(!hint) return;
  hint.textContent = text;
  hint.classList.toggle('warn', !!warn);
}

function okvedClosePanel(){
  const list = document.getElementById('okved-list');
  const input = document.getElementById('f_okved');
  list.hidden = true;
  list.innerHTML = '';
  input.setAttribute('aria-expanded','false');
  input.removeAttribute('aria-activedescendant');
  okvedItems = [];
  okvedActive = -1;
}

function okvedClearChoice(){
  document.getElementById('f_okved_code').value = '';
  document.getElementById('f_okved_name').value = '';
  const badge = document.getElementById('okved-badge');
  badge.hidden = true;
  badge.textContent = '';
}

function okvedHighlight(index){
  const list = document.getElementById('okved-list');
  const input = document.getElementById('f_okved');
  const options = list.querySelectorAll('.okved-option');
  options.forEach(el => el.classList.remove('active'));
  okvedActive = index;
  if(index < 0 || index >= options.length){
    input.removeAttribute('aria-activedescendant');
    return;
  }
  const current = options[index];
  current.classList.add('active');
  current.scrollIntoView({block:'nearest'});
  input.setAttribute('aria-activedescendant', current.id);
}

function okvedChoose(index){
  const item = okvedItems[index];
  if(!item) return;
  document.getElementById('f_okved').value = item.name;
  document.getElementById('f_okved_code').value = item.code;
  document.getElementById('f_okved_name').value = item.name;
  const badge = document.getElementById('okved-badge');
  badge.textContent = item.code;
  badge.hidden = false;
  okvedHint('Код ' + item.code + ' подобран, при желании поправьте вручную', false);
  okvedClosePanel();
}

function okvedRender(items){
  const list = document.getElementById('okved-list');
  const input = document.getElementById('f_okved');
  okvedItems = items;
  list.innerHTML = '';

  if(!items.length){
    const empty = document.createElement('li');
    empty.className = 'okved-empty';
    empty.textContent = 'Ничего не нашли — оставьте описание своими словами';
    list.appendChild(empty);
  } else {
    items.forEach((item, index) => {
      const option = document.createElement('li');
      option.className = 'okved-option';
      option.id = 'okved-option-' + index;
      option.setAttribute('role','option');
      option.setAttribute('aria-selected','false');
      const code = document.createElement('span');
      code.className = 'okved-code';
      code.textContent = item.code;
      const name = document.createElement('span');
      name.textContent = item.name;
      option.appendChild(code);
      option.appendChild(name);
      option.addEventListener('mousedown', event => {
        event.preventDefault();
        okvedChoose(index);
      });
      list.appendChild(option);
    });
  }

  list.hidden = false;
  input.setAttribute('aria-expanded','true');
  okvedHighlight(-1);
}

async function okvedFetch(query){
  const requestId = ++okvedRequestId;
  okvedHint('Ищем подходящие коды…', false);
  try{
    const res = await fetch(apiUrl('/okved/suggest?limit=5&q=' + encodeURIComponent(query)));
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    if(requestId !== okvedRequestId) return;
    okvedRender(data.items || []);
    okvedHint('Выберите подходящий код или впишите своими словами', false);
  } catch(e){
    if(requestId !== okvedRequestId) return;
    okvedClosePanel();
    okvedHint('Подсказки сейчас недоступны — впишите вид деятельности вручную', true);
  }
}

document.addEventListener('DOMContentLoaded', function(){
  const input = document.getElementById('f_okved');
  if(!input) return;

  input.addEventListener('input', function(){
    okvedClearChoice();
    clearTimeout(okvedTimer);
    const query = this.value.trim();
    if(query.length < OKVED_MIN_LENGTH){
      okvedClosePanel();
      okvedHint('Напишите своими словами, подберём код ОКВЭД', false);
      return;
    }
    okvedTimer = setTimeout(() => okvedFetch(query), OKVED_DEBOUNCE_MS);
  });

  input.addEventListener('keydown', function(event){
    const list = document.getElementById('okved-list');
    if(list.hidden){
      if(event.key === 'ArrowDown' && this.value.trim().length >= OKVED_MIN_LENGTH){
        okvedFetch(this.value.trim());
        event.preventDefault();
      }
      return;
    }
    if(event.key === 'ArrowDown'){
      event.preventDefault();
      okvedHighlight(Math.min(okvedActive + 1, okvedItems.length - 1));
    } else if(event.key === 'ArrowUp'){
      event.preventDefault();
      okvedHighlight(Math.max(okvedActive - 1, 0));
    } else if(event.key === 'Enter'){
      if(okvedActive >= 0){
        event.preventDefault();
        okvedChoose(okvedActive);
      }
    } else if(event.key === 'Escape'){
      okvedClosePanel();
    }
  });

  input.addEventListener('blur', function(){
    setTimeout(okvedClosePanel, 120);
  });
});

// ─── Form submit
async function submitForm(){
  const name    = document.getElementById('f_name').value.trim();
  const phone   = document.getElementById('f_phone').value.trim();
  const email   = document.getElementById('f_email').value.trim();
  const inn     = document.getElementById('f_inn').value.trim();
  const segment = document.getElementById('f_segment').value.trim();
  const okvedCode = document.getElementById('f_okved_code').value.trim();
  const okvedName = document.getElementById('f_okved_name').value.trim() || document.getElementById('f_okved').value.trim();


  let valid = true;

  // Имя
  if(name.length < 2){ setError('f_name','err_name',true); valid=false; }
  else { setError('f_name','err_name',false); }

  // Телефон - ровно 10 цифр
  const phoneDigits = phone.replace(/\D/g,'');
  const fwPhone = document.getElementById('fw-phone');
  if(phoneDigits.length !== 10){
    fwPhone.classList.add('invalid'); fwPhone.classList.remove('valid');
    document.getElementById('err_phone').classList.add('show');
    valid=false;
  } else {
    fwPhone.classList.remove('invalid'); fwPhone.classList.add('valid');
    document.getElementById('err_phone').classList.remove('show');
  }

  // Email
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!emailOk){ setError('f_email','err_email',true); valid=false; }
  else { setError('f_email','err_email',false); }

  // ИНН - 10 или 12 цифр
  const innDigits = inn.replace(/\D/g,'');
  if(innDigits.length !== 10 && innDigits.length !== 12){ setError('f_inn','err_inn',true); valid=false; }
  else { setError('f_inn','err_inn',false); }

  // Чекбокс
  const consent1 = document.getElementById('f_consent1').checked;
  const errConsent = document.getElementById('err_consent');
  if(!consent1){ errConsent.classList.add('show'); valid=false; }
  else { errConsent.classList.remove('show'); }

  if(!valid){
    // Скроллим к первой ошибке
    const firstErr = document.querySelector('.field input.invalid');
    if(firstErr) firstErr.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  try{
    const submitBtn = document.getElementById('form-submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Заявка отправлена';
    const res = await fetch(apiUrl('/leads'),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name, phone, email, inn: innDigits, segment,
        okved_code: okvedCode || null,
        okved_name: okvedName || null
      })
    });
    if(res.ok){
      const data = await res.json();
      openQuizModal(data.lead_id);
    } else {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Отправить заявку';
      alert('Ошибка при отправке. Попробуйте ещё раз.');
    }
  } catch(e){
    document.getElementById('formBody').style.display='none';
    document.getElementById('formSuccess').classList.add('show');
    openQuizModal(null);
  }
}

  if(!el)return;
  el.classList.remove('ping');
  void el.offsetWidth;        // restart the ping animation
  el.classList.add('ping');
}
let _barIdx=0;
function toggleBars(){
  const bars=document.querySelectorAll('#ic-bars .br');
  if(!bars.length)return;
  bars.forEach(b=>b.classList.remove('on'));
  _barIdx=(_barIdx+1)%(bars.length+1);   // 0,1,2, then none
  if(_barIdx<bars.length)bars[_barIdx].classList.add('on');
}
let _coinFlipped=false;
function flipCoin(){
  const el=document.getElementById('ic-coin');
  if(!el)return;
  _coinFlipped=!_coinFlipped;
  el.classList.toggle('flip',_coinFlipped);
}
function onPhoneCountry(){
  const s=document.getElementById('phone-country');
  const o=s.options[s.selectedIndex];
  document.getElementById('phone-flag').textContent=o.dataset.flag;
  document.getElementById('phone-code').textContent=o.value.replace('+7k','+7');
  document.getElementById('f_phone').value='';
  document.getElementById('fw-phone').classList.remove('invalid','valid');
  document.getElementById('err_phone').classList.remove('show');
  document.getElementById('f_phone').focus();
}
function onPhoneInput(){
  const d=document.getElementById('f_phone').value.replace(/\D/g,'');
  const fw=document.getElementById('fw-phone');
  if(d.length===10){fw.classList.remove('invalid');fw.classList.add('valid');document.getElementById('err_phone').classList.remove('show');}
  else{fw.classList.remove('valid','invalid');}
}
function onPhoneBlur(){
  const d=document.getElementById('f_phone').value.replace(/\D/g,'');
  const fw=document.getElementById('fw-phone');
  if(d.length===10){fw.classList.remove('invalid');fw.classList.add('valid');document.getElementById('err_phone').classList.remove('show');}
  else if(d.length>0){fw.classList.remove('valid');fw.classList.add('invalid');document.getElementById('err_phone').classList.add('show');}
}

const TEAL={r:10,g:147,b:150},TEAL2={r:0,g:95,b:115};
const RED={r:230,g:51,b:41},RED2={r:150,g:30,b:20};
function rgba(c,a){return `rgba(${c.r},${c.g},${c.b},${a})`;}
function proj(x,y,z){return{sx:CX+x-z*0.15,sy:CY+y-z*0.08,z};}
function helixPos(t,strand){
  const angle=t*TURNS*Math.PI*2+(strand===1?Math.PI:0);
  return{x:Math.cos(angle)*AMP,y:(t-0.5)*HTOTAL,z:Math.sin(angle)*AMP};
}
function drawSphere(sx,sy,r,col,col2,d,a){
  const dr=r*(0.72+d*0.28),da=a*(0.45+d*0.55);
  ctx.beginPath();ctx.ellipse(sx+dr*0.3,sy+dr*0.35,dr*0.85,dr*0.38,0,0,Math.PI*2);
  ctx.fillStyle=`rgba(0,0,0,${da*0.10})`;ctx.fill();
  const g=ctx.createRadialGradient(sx-dr*0.3,sy-dr*0.32,dr*0.05,sx,sy,dr);
  g.addColorStop(0,rgba({r:Math.min(255,col.r+80),g:Math.min(255,col.g+80),b:Math.min(255,col.b+80)},da));
  g.addColorStop(0.45,rgba(col,da));g.addColorStop(1,rgba(col2,da*0.9));
  ctx.beginPath();ctx.arc(sx,sy,dr,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  const s=ctx.createRadialGradient(sx-dr*0.25,sy-dr*0.30,0,sx,sy,dr*0.55);
  s.addColorStop(0,`rgba(255,255,255,${da*0.72})`);s.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(sx,sy,dr,0,Math.PI*2);ctx.fillStyle=s;ctx.fill();
}
function drawRung(pA,pB,d,a,prog){
  const aa=proj(pA.x,pA.y,pA.z),b=proj(pB.x,pB.y,pB.z);
  const mx=(aa.sx+b.sx)/2,my=(aa.sy+b.sy)/2;
  const da=a*(0.4+d*0.6);
  ctx.beginPath();
  ctx.moveTo(mx+(aa.sx-mx)*prog,my+(aa.sy-my)*prog);
  ctx.lineTo(mx+(b.sx-mx)*prog,my+(b.sy-my)*prog);
  ctx.strokeStyle=`rgba(10,147,150,${da*0.55})`;ctx.lineWidth=2+d*2;ctx.lineCap='round';ctx.stroke();
  drawSphere(mx+(aa.sx-mx)*prog,my+(aa.sy-my)*prog,RUNG_R,{r:230,g:100,b:90},RED2,d,a);
  drawSphere(mx+(b.sx-mx)*prog,my+(b.sy-my)*prog,RUNG_R,{r:70,g:140,b:195},TEAL2,d,a);
}
function frame(ts){
  if(!last)last=ts;
  elapsed+=Math.min((ts-last)/1000,0.05);last=ts;
  const t=elapsed;
  ctx.clearRect(0,0,W,H);
  const bob=Math.sin(t*0.75)*10;
  const elems=[];
  for(let i=0;i<PAIRS;i++){
    const tt=i/(PAIRS-1);
    const pA=helixPos(tt,0),pB=helixPos(tt,1);
    elems.push({type:'rung',pA:{...pA,y:pA.y+bob},pB:{...pB,y:pB.y+bob},z:(pA.z+pB.z)/2,i});
    elems.push({type:'ball',p:{...pA,y:pA.y+bob},z:pA.z,strand:0});
    elems.push({type:'ball',p:{...pB,y:pB.y+bob},z:pB.z,strand:1});
  }
  elems.sort((a,b)=>a.z-b.z);
  elems.forEach(el=>{
    const d=Math.max(0,Math.min(1,(el.z+AMP)/(AMP*2)));
    if(el.type==='ball'){
      const{sx,sy}=proj(el.p.x,el.p.y,el.p.z);
      drawSphere(sx,sy,BALL_R,el.strand===0?RED:TEAL,el.strand===0?RED2:TEAL2,d,1);
    }else{
      drawRung(el.pA,el.pB,d,1,0.62+((Math.sin(t*1.4+el.i*0.38)+1)/2)*0.38);
    }
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
