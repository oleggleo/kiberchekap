<!-- HOW IT WORKS -->
<section class="section" id="how">
  <div class="wrap">
    <div class="section-header centered">
      <div class="eyebrow">Методология</div>
      <h2>Как проходит<br><span class="hl">КиберЧекап</span></h2>
      <div class="accent-line"></div>
    </div>
    <div class="mz">
      <div class="mz-line"></div>
      <div class="mz-track" id="mztrack"></div>
    </div>
  </div>
</section>

<!-- FOR WHOM -->
<section class="section section-alt" id="for-whom">
  <div class="wrap">
    <div class="section-header">
      <div class="eyebrow">Целевая аудитория</div>
      <h2>Для бизнеса,<br>который <span class="hl">использует ИТ</span></h2>
      <p class="lead">Если у вас есть сайт, приложение, клиентская база, платёжные данные, учётные записи сотрудников или внутренние сервисы - вы уже в зоне риска. Самое время проверить, насколько вы защищены.</p>
    </div>
    <div class="segments-wrap">
      <div class="segments">
        <button class="seg-card" onclick="openSegModal(0)" type="button">
          <div class="seg-icon ec"><svg class="anim-ec" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle class="fx ec-item i1" cx="8.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle class="fx ec-item i2" cx="12" cy="6" r="1.3" fill="#ffe08a" stroke="none"/><circle class="fx ec-item i3" cx="15.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><g class="ec-bag"><path d="M5 8h14l-1 11a2 2 0 0 1-2 1.8H8A2 2 0 0 1 6 19L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></g></svg></div>
          <div class="seg-tag ec">E-COMMERCE</div>
          <h3>Интернет-магазины</h3>
          <p>Остановка продаж, утечка платёжных данных покупателей - магазин теряет выручку и доверие клиентов за считанные часы.</p>
          <p style="font-size:11px;font-weight:700;color:#0F6E56;margin-top:10px;margin-bottom:0;">НС: захват управления ключевым интернет-ресурсом</p>
          <p class="seg-hint">Нажмите, чтобы узнать подробнее →</p>
        </button>
        <button class="seg-card" onclick="openSegModal(1)" type="button">
          <div class="seg-icon ft"><svg class="anim-ft" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle class="fx ft-coin c1" cx="12" cy="12.5" r="1.5" fill="#ffe08a" stroke="none"/><circle class="fx ft-coin c2" cx="12" cy="12.5" r="1.5" fill="#ffd34d" stroke="none"/><circle class="fx ft-coin c3" cx="12" cy="12.5" r="1.5" fill="#ffe08a" stroke="none"/><g class="ft-note"><rect x="3" y="7.5" width="18" height="10" rx="2"/><circle cx="12" cy="12.5" r="2.2"/><path d="M6 10v.01M18 15v.01"/></g></svg></div>
          <div class="seg-tag ft">FINTECH</div>
          <h3>Финансовые сервисы</h3>
          <p>Хищение денежных средств, компрометация личных кабинетов - прямые финансовые потери и регуляторные санкции.</p>
          <p style="font-size:11px;font-weight:700;color:#185FA5;margin-top:10px;margin-bottom:0;">НС: несанкционированный вывод денежных средств</p>
          <p class="seg-hint">Нажмите, чтобы узнать подробнее →</p>
        </button>
      </div>
      <div class="segments-bot">
        <button class="seg-card" onclick="openSegModal(2)" type="button">
          <div class="seg-icon sa"><svg class="anim-sa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path class="sa-cloud" d="M6.5 16A4.5 4.5 0 0 1 6 7.05 6 6 0 0 1 17.7 6 4.5 4.5 0 0 1 17.5 16H6.5z"/><path class="fx sa-bolt" d="M12 15.5l-2.2 3.6h2.7L10.4 23" fill="#ffd34d" stroke="#ffd34d" stroke-width="1.3"/><path class="fx sa-check" d="M8.8 11l2.2 2.2 4.3-4.4"/></svg></div>
          <div class="seg-tag sa">SAAS</div>
          <h3>SaaS-продукты</h3>
          <p>Шифрование баз данных, потеря доступа клиентов к сервису - массовый отток и репутационный ущерб.</p>
          <p style="font-size:11px;font-weight:700;color:#534AB7;margin-top:10px;margin-bottom:0;">НС: массовый захват управления ИТ-инфраструктурой</p>
          <p class="seg-hint">Нажмите, чтобы узнать подробнее →</p>
        </button>
        <button class="seg-card" onclick="openSegModal(3)" type="button">
          <div class="seg-icon hl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M3 12h3l2 5 4-12 2 7h2.5"/><path pathLength="1" d="M18.5 12H21"/></svg></div>
          <div class="seg-tag hl">HEALTH</div>
          <h3>Медицина и клиники</h3>
          <p>Утечка медицинских данных пациентов, остановка записи - штрафы регулятора и риск потери лицензии.</p>
          <p style="font-size:11px;font-weight:700;color:#993C1D;margin-top:10px;margin-bottom:0;">НС: утечка конфиденциальной информации пациентов</p>
          <p class="seg-hint">Нажмите, чтобы узнать подробнее →</p>
        </button>
      </div>
      <div class="segments-last">
        <button class="seg-card" onclick="openSegModal(4)" type="button">
          <div class="seg-icon gv"><svg class="anim-gv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path class="gv-base" d="M3 21h18"/><g class="gv-house"><path d="M5 21V10M19 21V10M4 10l8-5 8 5M9 21v-6h6v6"/></g></svg></div>
          <div class="seg-tag gv">GOV / B2G</div>
          <h3>Госконтракты и B2G</h3>
          <p>Компрометация данных госзаказчика - потеря контракта и занесение в реестр недобросовестных поставщиков.</p>
          <p style="font-size:11px;font-weight:700;color:#3B6D11;margin-top:10px;margin-bottom:0;">НС: компрометация учётной записи руководителя</p>
          <p class="seg-hint">Нажмите, чтобы узнать подробнее →</p>
        </button>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="segModal" onclick="if(event.target===this)closeSegModal()">
      <div class="modal-box">
        <button class="modal-close" onclick="closeSegModal()">закрыть ✕</button>
        <div id="seg-modal-tag" class="seg-tag" style="margin-bottom:12px"></div>
        <h3 id="seg-modal-title" style="margin-bottom:20px;font-size:17px"></h3>
        <div id="seg-modal-body"></div>
      </div>
    </div>
  </div>
</section>
