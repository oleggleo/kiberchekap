<style>
/* ─── TOKENS ─────────────────────────────────────────── */
:root {
  --bg:        #f0f4f8;
  --bg2:       #e8eef5;
  --surface:   #ffffff;
  --panel:     #f7fafc;
  --border:    rgba(0,0,0,0.10);
  --border2:   rgba(0,0,0,0.18);
  --accent:    #e63329;
  --accent2:   #c0281f;
  --teal:      #0a9396;
  --teal2:     #005f73;
  --teal-dim:  rgba(10,147,150,0.08);
  --text:      #111a27;
  --muted:     #4a5a6e;
  --muted2:    #6a7a90;
  --dim:       #d0dae6;
  --mono:      'JetBrains Mono', monospace;
  --sans:      'Manrope', sans-serif;
  --display:   'Unbounded', 'Manrope', sans-serif;
  --radius:    8px;
  --radius2:   16px;
  --shadow:    0 1px 2px rgba(16,42,67,0.04), 0 4px 16px rgba(16,42,67,0.06);
  --shadow2:   0 2px 4px rgba(16,42,67,0.05), 0 18px 50px rgba(16,42,67,0.13);
  --ease-out:  cubic-bezier(.16,1,.3,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.7;
  overflow-x:hidden;
}

/* ─── NAV ────────────────────────────────────────────── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:500;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 48px;height:64px;
  background:rgba(240,244,248,0.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.nav-logo{
  display:flex;align-items:center;gap:10px;text-decoration:none;
}
.nav-logo-icon{
  width:36px;height:36px;
  background:var(--teal);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.nav-logo-icon svg{width:20px;height:20px}
.nav-logo-text{
  display:flex;flex-direction:column;line-height:1;gap:3px;
}
.nav-logo-main{
  font-family:var(--sans);font-size:15px;font-weight:800;
  color:var(--text);letter-spacing:-.01em;
}
.nav-logo-sub{
  font-family:var(--mono);font-size:9px;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase;
}
.nav-links{
  display:flex;gap:36px;align-items:center;
}
.nav-links a{
  font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;
  transition:color .2s;letter-spacing:.01em;
}
.nav-links a:hover{color:var(--text)}
.nav-cta{
  font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.01em;
  background:var(--accent);border:none;color:#fff;
  padding:10px 16px;border-radius:var(--radius);cursor:pointer;
  transition:all .2s;text-decoration:none;white-space:nowrap;
}
.nav-cta:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(230,51,41,0.3)}

/* ─── HERO ────────────────────────────────────────────── */
.hero{
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:stretch;
  padding:80px clamp(20px,4vw,64px) 48px;
  position:relative;overflow:hidden;
  gap:clamp(24px,4vw,64px);
  box-sizing:border-box;
  width:100%;
}
.hero-left{
  position:relative;z-index:2;
  display:flex;flex-direction:column;justify-content:center;
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--teal);margin-bottom:20px;
}
.hero-eyebrow::before{
  content:'';width:24px;height:2px;background:var(--teal);border-radius:2px;
}
.hero-title{
  font-family:var(--sans);font-weight:900;
  font-size:clamp(44px,5.8vw,78px);
  line-height:1.04;letter-spacing:-.03em;
  color:var(--text);margin-bottom:20px;
}
.hero-title-red{
  color:var(--accent);display:block;
}
.hero-sub{
  font-size:18px;color:var(--muted);max-width:480px;
  line-height:1.8;margin-bottom:28px;
}
.hero-sub strong{color:var(--text);font-weight:600}
.hero-stat-badge{
  display:inline-flex;align-items:center;gap:16px;
  background:rgba(230,51,41,0.06);border:1px solid rgba(230,51,41,0.18);
  border-radius:12px;padding:16px 22px;margin-bottom:28px;
}
.hero-stat-badge-num{
  font-family:var(--sans);font-size:32px;font-weight:900;
  color:var(--accent);letter-spacing:-.03em;line-height:1;
  white-space:nowrap;
}
.hero-stat-badge-text{
  font-size:14px;color:var(--muted);line-height:1.5;
}
.hero-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:0}
.btn-primary{
  font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.01em;
  background:var(--accent);color:#fff;border:none;
  padding:16px 28px;border-radius:var(--radius);cursor:pointer;
  transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
}
.btn-primary:hover{background:var(--accent2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(230,51,41,0.35)}
.btn-primary svg{width:16px;height:16px}
.btn-outline{
  font-family:var(--sans);font-size:13px;font-weight:600;
  color:var(--text);background:transparent;border:1.5px solid var(--border2);
  padding:13px 24px;border-radius:var(--radius);cursor:pointer;
  transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;
}
.btn-outline:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.hero-trust{
  display:flex;flex-direction:column;gap:16px;
}
.hero-trust-title{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted2);text-transform:uppercase;
}
.hero-trust-items{display:flex;gap:24px;flex-wrap:wrap}
.trust-item{
  display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:500;color:var(--muted);
}
.trust-item-icon{
  width:28px;height:28px;border-radius:6px;
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.trust-item-icon svg{width:14px;height:14px}

/* ─── HERO SVG ANIMATION ──────────────────────────────── */
.hero-right{
  position:relative;z-index:2;
  display:flex;align-items:flex-start;justify-content:center;
}
@keyframes glowPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1.08);opacity:.7}}

/* ─── HERO INTERACTIVE (fluid scaling) ───────────────── */
.hero-interactive{display:flex;flex-direction:column;gap:clamp(10px,1.2vw,20px);width:100%;position:relative;z-index:2}
.hero-proof{font-size:clamp(12px,1vw,15px);color:var(--muted);line-height:1.65;padding:clamp(12px,1.2vw,18px) clamp(14px,1.4vw,22px);background:var(--surface);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;box-shadow:var(--shadow)}
.hero-proof strong{color:var(--text)}
.hero-statrow{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.hero-sc{padding:clamp(12px,1.2vw,20px) clamp(10px,1vw,16px);border-right:1px solid var(--border);text-align:center}
.hero-sc:last-child{border-right:none}
.hero-sn{font-size:clamp(18px,2vw,32px);font-weight:900;letter-spacing:-.03em;line-height:1;margin-bottom:4px;color:var(--text)}
.hero-sn-r{color:var(--accent)}
.hero-sn-t{color:var(--teal)}
.hero-sl{font-size:clamp(11px,0.85vw,14px);color:var(--muted2);line-height:1.4}
.hero-quiz{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:clamp(14px,1.4vw,24px);box-shadow:var(--shadow)}
.hero-ql{font-family:var(--mono);font-size:clamp(9px,0.7vw,11px);letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:clamp(8px,0.8vw,12px)}
.hero-secs{display:flex;flex-wrap:wrap;gap:clamp(5px,0.5vw,9px);margin-bottom:clamp(10px,1vw,16px)}
.hero-sec{background:var(--panel);border:1px solid var(--border2);border-radius:7px;padding:clamp(5px,0.5vw,9px) clamp(10px,1vw,18px);cursor:pointer;font-family:var(--sans);font-size:clamp(11px,0.9vw,14px);font-weight:600;color:var(--muted);transition:all .18s}
.hero-sec:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.hero-sec.active{border-color:var(--teal);background:var(--teal-dim);color:var(--teal2)}
.hero-res{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:clamp(12px,1.2vw,18px);min-height:clamp(72px,7vw,110px);transition:all .2s}
.hero-res.on{background:rgba(230,51,41,0.04);border-color:rgba(230,51,41,0.18)}
.hero-res-empty{font-size:clamp(11px,0.9vw,13px);color:var(--muted2);display:flex;align-items:center;justify-content:center;height:100%;min-height:clamp(48px,5vw,74px)}
.hero-rns{font-family:var(--mono);font-size:clamp(8px,0.65vw,10px);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.hero-rt{font-size:clamp(12px,1.05vw,16px);font-weight:700;color:var(--text);line-height:1.4;margin-bottom:4px}
.hero-rd{font-size:clamp(10px,0.85vw,13px);color:var(--muted);line-height:1.5;margin-bottom:8px}
.hero-rp{display:flex;align-items:center;gap:10px}
.hero-bw{flex:1;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.hero-b{height:100%;background:var(--accent);border-radius:2px;transition:width .55s ease;width:0%}
.hero-pn{font-size:clamp(12px,1.05vw,16px);font-weight:900;color:var(--accent)}
.hero-src{font-size:clamp(9px,0.65vw,11px);color:var(--muted2);font-family:var(--mono);margin-top:10px}
.hero-pdf-btn{
  display:none;align-items:center;gap:8px;margin-top:10px;
  font-family:var(--mono);font-size:clamp(9px,0.7vw,11px);
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--teal);text-decoration:none;
  border:1px solid var(--teal);border-radius:6px;
  padding:7px 14px;width:fit-content;
  transition:all .2s;background:transparent;cursor:pointer;
}
.hero-pdf-btn:hover{background:var(--teal-dim);color:var(--teal2)}
.hero-pdf-btn.visible{display:inline-flex}
.hero-pdf-btn svg{width:13px;height:13px;flex-shrink:0}


/* ─── STATS BAND ──────────────────────────────────────── */
.stats-band{
  background:var(--teal2);color:#fff;
  padding:clamp(20px,2.5vw,40px) clamp(20px,4vw,64px) clamp(32px,4vw,56px);
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:auto auto;gap:0;
  position:relative;overflow:hidden;
}
.stats-band::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size:24px 24px;
}
.stat-item{
  text-align:center;position:relative;z-index:1;
  padding:clamp(12px,1.5vw,24px) clamp(16px,2vw,36px);
}
.stat-item:not(:last-child){
  border-right:1px solid rgba(255,255,255,0.15);
}
.stat-icon{
  width:clamp(32px,3.5vw,48px);height:clamp(32px,3.5vw,48px);margin:0 auto clamp(8px,1vw,16px);
  background:rgba(255,255,255,0.1);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.stat-icon svg{width:clamp(16px,1.8vw,24px);height:clamp(16px,1.8vw,24px)}
.stat-num{
  font-family:var(--sans);font-size:clamp(28px,4vw,56px);font-weight:900;
  letter-spacing:-.03em;line-height:1;margin-bottom:6px;color:#fff;
}
.stat-label{
  font-size:clamp(13px,1.1vw,16px);color:#ffffff;line-height:1.4;font-weight:500;
}

/* ─── SECTION BASE ────────────────────────────────────── */
.hero-section{
  position:relative;overflow:hidden;
  background:var(--bg);
}
.hero-bg{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 80% at 70% 50%, rgba(10,147,150,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 20% 80%, rgba(230,51,41,0.04) 0%, transparent 60%);
}
.hero-dots{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle, rgba(10,147,150,0.15) 1px, transparent 1px);
  background-size:32px 32px;
  mask-image:radial-gradient(ellipse 70% 80% at 65% 40%, black 20%, transparent 80%);
}
.section{padding:clamp(48px,5.5vw,88px) 0}
.section-alt{background:var(--surface)}
.wrap{max-width:100%;margin:0 auto;padding:0 clamp(20px,4vw,64px);box-sizing:border-box}
.eyebrow{
  font-family:var(--mono);font-size:clamp(9px,0.75vw,11px);letter-spacing:.14em;
  color:var(--teal);margin-bottom:12px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
}
.eyebrow::before{content:'';width:20px;height:2px;background:var(--teal);border-radius:2px}
h2{
  font-size:clamp(24px,3.8vw,52px);font-weight:800;
  color:var(--text);letter-spacing:-.025em;line-height:1.1;margin-bottom:16px;
}
h2 .hl{color:var(--teal)}
h2 .hlr{color:var(--accent)}
.lead{font-size:clamp(15px,1.15vw,18px);color:var(--muted);line-height:1.8;max-width:560px}
.section-header{margin-bottom:clamp(32px,4vw,64px)}
.section-header.centered{text-align:center}
.section-header.centered .eyebrow{justify-content:center}
.section-header.centered .lead{margin:0 auto}
.accent-line{
  width:40px;height:3px;background:var(--accent);
  border-radius:2px;margin:16px 0 0;
}
.section-header.centered .accent-line{margin:16px auto 0}

/* ─── WHAT YOU GET ───────────────────────────────────── */
.benefits-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:clamp(12px,1.5vw,24px);
}
.benefit-card{
  /* top accent painted as a clipped background stripe -> conforms exactly to the card's rounded corners, full width */
  background-color:var(--surface);
  background-image:linear-gradient(var(--teal),var(--teal));
  background-repeat:no-repeat;
  background-position:top center;
  background-size:0% 3px;
  border:1px solid var(--border);
  border-radius:var(--radius2);padding:clamp(18px,2vw,32px) clamp(16px,1.8vw,28px);
  transition:transform .45s var(--ease-out),box-shadow .25s,border-color .25s,background-size .35s var(--ease-out);
  position:relative;overflow:hidden;
}
.benefit-card::before{display:none}
.benefit-card:hover{transform:translateY(-4px) scale(1.02);box-shadow:var(--shadow2);border-color:rgba(10,147,150,0.2);background-size:100% 3px}
.benefit-icon{
  width:62px;height:62px;flex-shrink:0;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:clamp(12px,1.5vw,20px);
  cursor:pointer;user-select:none;transition:transform .2s;
}
.benefit-icon:active{transform:scale(0.94)}
/* eye */
.ic-eye{background:#0a9396;position:relative;overflow:hidden}
.ic-eye .ic-magn{position:relative;width:36px;height:36px}
.ic-eye .lens{position:absolute;inset:0;width:28px;height:28px;border:2.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ic-eye .handle{position:absolute;right:-2px;bottom:-2px;width:11px;height:2.5px;background:#fff;border-radius:2px;transform:rotate(45deg);transform-origin:right center}
.eye-lid{width:14px;height:14px;border-radius:50%;background:#fff;position:relative;transition:height .12s ease}
.eye-lid::after{content:'';position:absolute;inset:0;margin:auto;width:6px;height:6px;border-radius:50%;background:#005f73}
.ic-eye.blink .eye-lid{height:1.5px}
.ic-eye.blink .eye-lid::after{opacity:0}
/* checklist */
.ic-list{background:#BA7517;padding:10px 12px;position:relative;overflow:hidden}
.ic-list .doc{width:36px;height:36px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.ic-list .li{display:flex;align-items:center;gap:6px}
.ic-list .cb{width:11px;height:11px;border:2px solid #fff;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;transition:background .15s}
.ic-list .cb svg{width:8px;height:8px;opacity:0;transition:opacity .12s}
.ic-list .cb.done{background:#fff}
.ic-list .cb.done svg{opacity:1}
.ic-list .ln{flex:1;height:2px;background:rgba(255,255,255,0.65);border-radius:2px}
/* coin */
.ic-coin-wrap{background:linear-gradient(145deg,#16a8ab,#04575f);perspective:600px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.ic-coin-wrap .coin{width:42px;height:42px;border-radius:50%;position:relative;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transform-origin:center center;transition:transform .8s cubic-bezier(.4,.2,.2,1)}
.ic-coin-wrap.flip .coin{transform:rotateY(180deg)}
.ic-coin-wrap .face{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;-webkit-backface-visibility:hidden;backface-visibility:hidden;font-weight:900;font-size:24px;color:#fff;overflow:hidden}
.ic-coin-wrap .face.front{background:#e63329}
.ic-coin-wrap .face.front::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 80% 15%,rgba(247,193,193,0.35) 0%,transparent 55%);pointer-events:none}
.ic-coin-wrap .face.front span{position:relative;z-index:1}
.ic-coin-wrap .face.back{background:#e63329;transform:rotateY(180deg)}
.ic-coin-wrap .face.back::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 80% 15%,rgba(247,193,193,0.35) 0%,transparent 55%);pointer-events:none}
.ic-coin-wrap .face.back svg{position:relative;z-index:1;width:24px;height:24px;stroke:#fff;stroke-width:1.8;fill:none}
/* mobile-safe flip: swap faces by opacity at mid-rotation (defends against iOS backface bug) */
.ic-coin-wrap .face.front{opacity:1;transition:opacity 0s linear .4s}
.ic-coin-wrap .face.back{opacity:0;transition:opacity 0s linear .4s}
.ic-coin-wrap.flip .face.front{opacity:0}
.ic-coin-wrap.flip .face.back{opacity:1}
.benefit-title{font-size:clamp(13px,1.1vw,16px);font-weight:700;color:var(--text);margin-bottom:8px}
.benefit-desc{font-size:clamp(12px,0.9vw,14px);color:var(--muted);line-height:1.7}
.benefit-infograph{
  margin-top:clamp(12px,1.2vw,18px);
  padding-top:clamp(10px,1vw,14px);
  border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;
}
.bi-label{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted2);margin-bottom:4px;
}
.bi-bar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.bi-bar-name{font-size:11px;color:var(--muted);}
.bi-bar-val{font-size:11px;font-weight:600;color:var(--text);}
.bi-bar-wrap{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.bi-bar{height:100%;border-radius:3px;transition:width .4s ease;}
.bi-check-list{display:flex;flex-direction:column;gap:5px;}
.bi-check-item{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--muted);}
.bi-check-item svg{margin-top:2px;}
.bi-check-item svg{flex-shrink:0;}
.bi-cq-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 9px;border-radius:6px;border:1px solid transparent;
}
.bi-cq-name{font-size:11px;color:var(--muted);}
.bi-cq-val{font-size:12px;font-weight:700;}
.cta-stat-pill{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border2);
}
.cta-stat-num{font-size:22px;font-weight:900;color:var(--accent);letter-spacing:-.02em;line-height:1;}
.cta-stat-label{font-size:12px;color:var(--muted);line-height:1.4;text-align:right;max-width:180px;}

/* ─── RESULTS LIST ───────────────────────────────────── */
.results-list{display:flex;flex-direction:column;gap:0;margin-top:clamp(28px,3vw,52px)}
.result-item{
  display:grid;grid-template-columns:clamp(48px,5vw,72px) clamp(20px,2.5vw,36px) 1fr clamp(48px,5vw,72px);
  align-items:center;gap:0;
  padding:clamp(16px,2vw,32px) 0;
  border-bottom:1px solid var(--border);
  transition:background .2s;
  position:relative;
}
.result-item:last-child{border-bottom:none}
.result-item:hover{background:rgba(10,147,150,0.02);border-radius:var(--radius)}
.result-num{
  font-family:var(--mono);font-size:clamp(20px,2.2vw,30px);font-weight:700;
  color:var(--dim);letter-spacing:-.02em;line-height:1;
  transition:color .2s;
}
.result-num.accent{color:rgba(230,51,41,0.2)}
.result-item:hover .result-num{color:var(--teal)}
.result-item:hover .result-num.accent{color:var(--accent)}
.result-connector{
  width:2px;height:100%;background:var(--dim);
  margin:0 auto;align-self:stretch;
}
.result-connector.accent{background:rgba(230,51,41,0.15)}
.result-body{padding:0 clamp(14px,2.5vw,36px)}
.result-title{
  font-size:clamp(15px,1.4vw,20px);font-weight:700;color:var(--text);
  margin-bottom:6px;letter-spacing:-.01em;
}
.result-desc{font-size:clamp(12px,1vw,15px);color:var(--muted);line-height:1.7}
.result-icon{
  width:clamp(40px,4vw,56px);height:clamp(40px,4vw,56px);border-radius:14px;
  border:1px solid;
  display:flex;align-items:center;justify-content:center;
  justify-self:end;flex-shrink:0;
}
.result-icon svg{width:clamp(18px,1.8vw,24px);height:clamp(18px,1.8vw,24px)}
@media(max-width:640px){
  .result-item{grid-template-columns:48px 20px 1fr 0px}
  .result-icon{display:none}
  .result-body{padding:0 16px}
  .result-num{font-size:20px}
}

/* ─── HOW IT WORKS (responsive zigzag) ────────────────── */
.mz{position:relative;margin-top:clamp(28px,3vw,52px)}
.mz-line{position:absolute;left:40px;right:40px;top:50%;height:1px;background:var(--border);transform:translateY(-50%);z-index:0}
.mz-track{display:grid;grid-template-columns:repeat(5,1fr);position:relative;z-index:1;height:560px}
.mz-col{position:relative;cursor:pointer}
.mz-card{position:absolute;left:50%;transform:translateX(-50%);width:96%;height:250px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:18px 14px;transition:all .25s;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.mz-card:hover{border-color:var(--border2)}
.mz-card.act{border-color:currentColor;border-width:1.5px}
.mz-col.top .mz-card{bottom:calc(50% + 34px)}
.mz-col.bottom .mz-card{top:calc(50% + 34px)}
.mz-icon{width:42px;height:42px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;transition:background .25s;flex-shrink:0}
.mz-card.act .mz-icon{background:currentColor}
.mz-icon svg{width:21px;height:21px;color:var(--muted2);transition:color .25s}
.mz-card.act .mz-icon svg{color:#fff}
.mz-num{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted2);margin-bottom:6px;transition:color .25s}
.mz-card.act .mz-num{color:currentColor}
.mz-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:6px}
.mz-desc{font-size:12px;color:var(--muted);line-height:1.55}
.mz-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:var(--muted2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:#fff;transition:background .3s;z-index:2;border:3px solid var(--panel)}
@media(max-width:1200px){
  .mz-line{left:21px;right:auto;top:24px;bottom:24px;width:2px;height:auto;transform:none}
  .mz-track{display:flex;flex-direction:column;gap:22px;height:auto}
  .mz-col{display:flex;flex-direction:row;align-items:center;gap:18px;position:static}
  .mz-dot{position:static;transform:none;flex-shrink:0;order:-1}
  .mz-card{position:static;transform:none;width:auto;height:auto;flex:1;text-align:left;align-items:flex-start}
  .mz-icon{margin:0 0 10px 0}
  .mz-num{font-size:11px}
  .mz-title{font-size:15px}
  .mz-desc{font-size:13px}
}

/* ─── FOR WHOM ────────────────────────────────────────── */
.segments-wrap{display:flex;flex-direction:column;gap:clamp(10px,1.2vw,18px)}
.segments{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:clamp(10px,1.2vw,18px);
}
.segments-last{
  display:grid;grid-template-columns:1fr;
  gap:clamp(10px,1.2vw,18px);max-width:50%;margin:0 auto;width:100%;
}
.segments-bot{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:clamp(10px,1.2vw,18px);
}
.seg-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius2);padding:clamp(16px,2vw,28px);
  transition:all .25s;cursor:pointer;
  text-align:left;width:100%;font-family:var(--sans);
  -webkit-appearance:none;appearance:none;
}
.seg-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:rgba(10,147,150,0.2)}
.seg-tag{
  font-family:var(--mono);font-size:clamp(8px,0.7vw,10px);letter-spacing:.12em;
  padding:4px 10px;border-radius:100px;display:inline-block;margin-bottom:clamp(8px,1vw,14px);
  border:1px solid;
}
.seg-tag.ec{color:#0F6E56;background:#E1F5EE;border-color:rgba(15,110,86,0.2)}
.seg-tag.ft{color:#185FA5;background:#E6F1FB;border-color:rgba(24,95,165,0.2)}
.seg-tag.sa{color:#534AB7;background:#EEEDFE;border-color:rgba(83,74,183,0.2)}
.seg-tag.hl{color:#993C1D;background:#FAECE7;border-color:rgba(153,60,29,0.2)}
.seg-tag.gv{color:#3B6D11;background:#EAF3DE;border-color:rgba(59,109,17,0.2)}
.seg-card h3{font-size:clamp(13px,1.2vw,17px);font-weight:700;color:var(--text);margin-bottom:8px}
.seg-card p{font-size:clamp(11px,0.95vw,14px);color:var(--muted);line-height:1.7;margin:0}
.seg-hint{font-size:clamp(10px,0.8vw,12px);color:var(--muted2);margin-top:10px!important;}

/* ─── MODAL ───────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal-box{
  background:var(--surface);border-radius:var(--radius2);
  border:1px solid var(--border2);padding:28px;
  max-width:500px;width:100%;max-height:85vh;overflow-y:auto;
  transform:translateY(16px);transition:transform .2s;
}
.modal-overlay.show .modal-box{transform:translateY(0)}
.modal-close{
  float:right;background:none;border:1px solid var(--border2);
  border-radius:var(--radius);padding:4px 12px;font-size:12px;
  cursor:pointer;color:var(--muted);font-family:var(--sans);
}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-section{margin-bottom:16px}
.modal-section-title{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:var(--muted2);text-transform:uppercase;margin-bottom:8px;
}
.modal-section ul{margin:0;padding:0;list-style:none}
.modal-section ul li{
  font-size:13px;color:var(--text);line-height:1.7;
  padding:2px 0 2px 16px;position:relative;
}
.modal-section ul li::before{content:'-';position:absolute;left:0;color:var(--muted2)}
.modal-criteria{
  font-size:13px;color:var(--muted);line-height:1.7;
  background:var(--panel);border-radius:var(--radius);
  padding:12px 16px;border-left:3px solid var(--teal);
}

/* ─── DELIVERABLES ────────────────────────────────────── */
.deliverables{display:flex;flex-direction:column;gap:8px;margin-top:0}
.del-row{
  display:grid;grid-template-columns:200px 1fr 130px;
  align-items:center;gap:24px;
  padding:18px 24px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);
  font-size:13px;transition:all .2s;
}
.del-row:hover{border-color:rgba(10,147,150,0.2);box-shadow:0 2px 12px rgba(0,0,0,0.05)}
.del-name{font-family:var(--mono);font-size:11px;color:var(--teal);letter-spacing:.04em;font-weight:500}
.del-desc{color:var(--muted);font-size:13px}
.del-badge{
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;
  text-align:right;color:var(--muted2);
}
.del-badge.green{
  color:#059669;background:rgba(5,150,105,0.08);
  padding:3px 10px;border-radius:100px;
  border:1px solid rgba(5,150,105,0.2);
}
.del-badge.warn{
  color:var(--accent);background:rgba(230,51,41,0.06);
  padding:3px 10px;border-radius:100px;
  border:1px solid rgba(230,51,41,0.2);
}

/* ─── DELIVERABLES TEXT ───────────────────────────────── */
.del-text-block{
  max-width:680px;
  display:flex;flex-direction:column;gap:20px;
  margin-top:8px;
}
.del-text-block p{
  font-size:15px;color:var(--muted);line-height:1.85;
}
.del-text-block p strong{
  color:var(--text);font-weight:700;
}

/* ─── PRICING ─────────────────────────────────────────── */
.pricing-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}
.price-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius2);padding:36px;position:relative;overflow:hidden;
}
.price-card.featured{
  border-color:var(--teal);
  background:linear-gradient(135deg, rgba(10,147,150,0.04) 0%, var(--surface) 100%);
}
.price-card.featured::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg, var(--teal), var(--teal2));
}
.price-featured-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  background:var(--teal);color:#fff;padding:5px 14px;
  border-radius:100px;font-weight:600;margin-bottom:20px;
}
.price-name{
  font-family:var(--mono);font-size:11px;color:var(--muted2);
  letter-spacing:.08em;margin-bottom:20px;text-transform:uppercase;
}
.price-amount{font-size:38px;font-weight:900;color:var(--text);letter-spacing:-.03em;line-height:1}
.price-period{font-size:12px;color:var(--muted2);margin-top:6px;margin-bottom:28px}
.price-features{list-style:none;display:flex;flex-direction:column;gap:12px}
.price-features li{
  font-size:13px;color:var(--muted);
  display:flex;gap:10px;align-items:flex-start;
}
.price-features li::before{
  content:'';width:16px;height:16px;border-radius:50%;
  background:rgba(10,147,150,0.1);border:1.5px solid var(--teal);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 8l3 3 5-5' stroke='%230a9396' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-size:contain;background-repeat:no-repeat;
}

/* ─── FAQ ─────────────────────────────────────────────── */
.faq-list{display:flex;flex-direction:column;gap:8px;margin-top:48px}
.faq-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  transition:border-color .2s;
}
.faq-item.open{border-color:rgba(10,147,150,0.25)}
.faq-q{
  width:100%;padding:20px 24px;
  display:flex;justify-content:space-between;align-items:center;
  background:transparent;border:none;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--text);font-family:var(--sans);
  text-align:left;
}
.faq-q:hover{color:var(--teal2)}
.faq-icon{
  width:28px;height:28px;border-radius:50%;
  background:var(--bg);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-left:16px;transition:all .25s;
  font-size:14px;color:var(--muted);
}
.faq-item.open .faq-icon{
  transform:rotate(45deg);
  background:var(--teal);border-color:var(--teal);color:#fff;
}
.faq-a{
  max-height:0;overflow:hidden;transition:max-height .35s ease;
  font-size:13px;color:var(--muted);line-height:1.8;
}
.faq-item.open .faq-a{max-height:200px}
.faq-a-inner{padding:0 24px 20px;border-top:1px solid var(--border)}

/* ─── CTA / FORM ──────────────────────────────────────── */
#cta{
  padding:96px 48px;
  background:linear-gradient(160deg,#04342c 0%,#0a9396 40%,#534ab7 100%);
  position:relative;overflow:hidden;
}
#cta::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 78% 12%,rgba(230,51,41,0.4) 0%,transparent 42%),radial-gradient(circle at 8% 88%,rgba(31,158,117,0.45) 0%,transparent 48%);
}
#cta::after{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
  background-size:28px 28px;
}
.cta-inner{
  display:grid;grid-template-columns:1fr 440px;
  gap:48px;align-items:center;position:relative;z-index:1;
  max-width:1100px;margin:0 auto;
}
.cta-left{position:relative}
.cta-panel-icon{
  width:48px;height:48px;border-radius:12px;
  background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.25);
  display:flex;align-items:center;justify-content:center;margin-bottom:24px;
}
.cta-left .eyebrow{color:rgba(255,255,255,0.75)}
.cta-left .eyebrow::before{background:rgba(255,255,255,0.5)}
.cta-title{
  font-size:clamp(28px,3.5vw,44px);font-weight:900;
  color:#fff;letter-spacing:-.025em;line-height:1.12;margin-bottom:16px;
}
.cta-desc{font-size:15px;color:rgba(255,255,255,0.7);line-height:1.7;margin-bottom:28px;max-width:420px}
.cta-panel-stats{display:flex;gap:28px}
.cta-sn{font-size:clamp(22px,2.2vw,28px);font-weight:900;color:#fff;line-height:1}
.cta-sl{font-size:11px;color:rgba(255,255,255,0.6);margin-top:5px;line-height:1.4}
.cta-perks{display:flex;flex-direction:column;gap:12px}
.cta-perk{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:rgba(255,255,255,0.7);
}
.cta-perk-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--teal);flex-shrink:0;
}

.form-shell{
  background:var(--surface);
  border-radius:var(--radius2);
  box-shadow:0 24px 64px rgba(0,0,0,0.3);
  width:100%;max-width:440px;
  margin:0 auto;
}
.form-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);
  border-radius:var(--radius2) var(--radius2) 0 0;
}
.form-dots{display:flex;gap:6px}
.form-dot{width:10px;height:10px;border-radius:50%}
.form-dot.r{background:#ff5f57}
.form-dot.y{background:#ffbd2e}
.form-dot.g{background:#28c840}
.form-bar-title{font-family:var(--mono);font-size:10px;color:var(--muted2);letter-spacing:.06em}
.form-status{
  display:flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9px;color:var(--teal);letter-spacing:.06em;
}
.form-status::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--teal);animation:pulse 1.8s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.form-body{padding:28px}
.field{margin-bottom:18px}
.fw-phone{display:flex;align-items:center;width:100%;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);transition:border-color .2s;overflow:hidden;height:46px;}
.fw-phone:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,147,150,0.1);}
.fw-phone.invalid{border-color:#e63329!important;background:rgba(230,51,41,0.04);}
.fw-phone.valid{border-color:rgba(29,158,117,0.5);}
.fc-phone{display:flex;align-items:center;gap:5px;padding:0 10px 0 14px;border-right:1.5px solid var(--border2);cursor:pointer;position:relative;flex-shrink:0;height:100%;}
.fc-phone .fc-flag{font-size:15px;line-height:1;}
.fc-phone .fc-code{font-size:14px;color:var(--text);line-height:1;}
.fc-phone .fc-arr{font-size:9px;color:var(--muted2);line-height:1;}
.fc-phone select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:none;border-radius:0!important;margin:0;padding:0;}
.fn-phone{border:none!important;border-radius:0!important;background:transparent!important;font-size:14px;color:var(--text);padding:0 16px;flex:1;outline:none;min-width:0;height:100%;-webkit-appearance:none;-moz-appearance:none;appearance:none;box-shadow:none!important;line-height:1;font-family:var(--sans);}
.fn-phone::placeholder{color:var(--muted2);}
.field-error{font-size:11px;color:#e63329;margin-top:3px;display:none;font-family:var(--mono);letter-spacing:.02em;}
.field-error.show{display:block;}
.field input.invalid{border-color:#e63329!important;background:rgba(230,51,41,0.04)!important;}
.field input.valid{border-color:rgba(29,158,117,0.5)!important;}
.field label{
  display:block;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;color:var(--muted);margin-bottom:7px;text-transform:uppercase;
}
.field input{
  width:100%;background:var(--bg);border:1.5px solid var(--border2);
  border-radius:var(--radius);color:var(--text);
  padding:12px 16px;font-size:14px;font-family:var(--sans);
  outline:none;transition:border-color .2s;
}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,147,150,0.1)}
.field input::placeholder{color:var(--muted2)}
.okved-wrap{position:relative}
.okved-wrap input{padding-right:78px}
.okved-badge{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  color:var(--teal2);background:var(--teal-dim);
  border:1px solid rgba(10,147,150,0.25);border-radius:6px;
  padding:3px 8px;pointer-events:none;
}
.okved-list{
  position:absolute;z-index:40;left:0;right:0;top:calc(100% + 6px);
  list-style:none;margin:0;padding:4px;
  background:var(--surface);border:1.5px solid var(--border2);
  border-radius:var(--radius);box-shadow:var(--shadow2);
  max-height:264px;overflow-y:auto;
}
.okved-option{
  display:flex;align-items:baseline;gap:10px;
  padding:9px 10px;border-radius:6px;cursor:pointer;
  font-family:var(--sans);font-size:13px;color:var(--text);line-height:1.35;
}
.okved-option:hover,.okved-option.active{background:var(--teal-dim)}
.okved-option .okved-code{
  font-family:var(--mono);font-size:11px;color:var(--teal2);
  flex-shrink:0;min-width:44px;
}
.okved-empty{
  padding:10px;font-family:var(--sans);font-size:12px;color:var(--muted2);
}
.okved-hint{
  display:block;margin-top:5px;
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--muted2);
}
.okved-hint.warn{color:#e63329}
.form-submit{
  width:100%;margin-top:4px;
  background:var(--accent);border:none;border-radius:var(--radius);
  color:#fff;font-family:var(--sans);font-size:14px;
  letter-spacing:.01em;font-weight:700;
  padding:14px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.form-submit:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(230,51,41,0.35)}
